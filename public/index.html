
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management | Corizo</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Corizo Student Manager</a>
      <span class="text-white small">CRUD Application</span>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="mb-4">
      <h1 class="fw-bold">Student Dashboard</h1>
      <p class="text-secondary mb-0">
        Add, view, update and manage student records.
      </p>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="row g-4">
      <section class="col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 id="formTitle" class="h5 fw-bold mb-3">Add New Student</h2>

            <form id="studentForm">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input
                  id="name" name="name" class="form-control"
                  type="text" maxlength="100" required
                  placeholder="Enter student name"
                >
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  id="email" name="email" class="form-control"
                  type="email" maxlength="254" required
                  placeholder="student@example.com"
                >
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                  id="phone" name="phone" class="form-control"
                  type="tel" maxlength="25" required
                  placeholder="Enter phone number"
                >
              </div>

              <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <input
                  id="course" name="course" class="form-control"
                  type="text" maxlength="100" required
                  placeholder="e.g. Computer Science"
                >
              </div>

              <button id="submitBtn" class="btn btn-primary w-100" type="submit">
                Add Student
              </button>

              <button
                id="cancelBtn" class="btn btn-outline-secondary w-100 mt-2 d-none"
                type="button"
              >
                Cancel Edit
              </button>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <div>
                <h2 class="h5 fw-bold mb-1">Student Records</h2>
                <span class="text-secondary small">
                  Total students: <strong id="studentCount">0</strong>
                </span>
              </div>

              <button id="refreshBtn" class="btn btn-outline-primary btn-sm">
                Refresh
              </button>
            </div>

            <input
              id="searchInput" class="form-control mb-3"
              type="search" placeholder="Search by name, email, phone or course..."
              aria-label="Search students"
            >

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>Course</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="studentTable">
                  <tr>
                    <td colspan="4" class="text-center text-secondary py-4">
                      Loading students...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="text-center text-secondary py-4 small">
    Corizo Web Development Training Project
  </footer>

  <script src="script.js"></script>
</body>
</html>
